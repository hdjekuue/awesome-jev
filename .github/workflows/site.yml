name: Site

# Builds the trilingual site (Astro → docs/) plus every machine-readable export,
# then commits the result. docs/ is the GitHub Pages source, so it has to be
# committed for the site and for the AIEO endpoints to exist at all.

on:
  push:
    branches: [main]
    paths:
      - 'data/entries.json'
      - 'src/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'scripts/build-ai-artifacts.mjs'
      - '.github/workflows/site.yml'
  workflow_run:
    workflows: ['Refresh', 'Translate']
    types: [completed]
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build site and AI artifacts
        run: npm run build

      - name: Generated output is correct
        run: bash scripts/check-parity.sh

      - name: The AIEO endpoints exist
        run: |
          set -e
          for f in llms.txt llms-full.txt skill.md projects.json sitemap.xml robots.txt assets/og.svg c/context.md; do
            test -s "docs/$f" || { echo "::error::missing docs/$f"; exit 1; }
          done
          echo "llms.txt $(wc -c < docs/llms.txt)B · llms-full.txt $(wc -c < docs/llms-full.txt)B · skill.md $(wc -c < docs/skill.md)B · projects.json $(wc -c < docs/projects.json)B"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ llms.txt llms-full.txt skill.md projects.json
          if git diff --cached --quiet; then
            echo "Site unchanged — nothing to do."
            exit 0
          fi
          git commit -m "chore(site): rebuild site and AIEO exports [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main