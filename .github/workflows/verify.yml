name: Verify

# Deterministic, model-free gate. This is the check that must be green to merge.
# 确定性校验（不调用任何模型），是合并的硬性条件。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

- uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Schema, duplicates, categories, description hygiene
        run: node scripts/verify.mjs

      - name: JSON parses
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/entries.json','utf8')); console.log('data/entries.json OK')"

      - name: Generated files are up to date
        run: |
          set -e
          npm ci
          node scripts/build-readme.mjs --check
          npm run build
          if ! git diff --quiet -- README.md README.zh.md README.fr.md docs/ llms.txt llms-full.txt skill.md projects.json; then
            echo "::error::Generated files are stale. Run: node scripts/build-readme.mjs && npm run build"
            git diff --stat -- README.md README.zh.md README.fr.md docs/ llms.txt llms-full.txt skill.md projects.json | tail -n 20
            exit 1
          fi
          echo "generated files match data/entries.json"

      - name: Trilingual row parity
        run: |
          set -e
          for f in README.md README.zh.md README.fr.md; do
            printf '%s: %s rows\n' "$f" "$(grep -c '^| \[' "$f" || true)"
          done
          EN=$(grep -c '^| \[' README.md || true)
          ZH=$(grep -c '^| \[' README.zh.md || true)
          FR=$(grep -c '^| \[' README.fr.md || true)
          if [ "$EN" != "$ZH" ] || [ "$EN" != "$FR" ]; then
            echo "::error::Row counts differ across languages: en=$EN zh=$ZH fr=$FR"
            exit 1
          fi
          echo "row parity OK ($EN)"

      - name: Translation coverage is reported, not gated globally
        # Translation is a progressive, scheduled job — the free model quota fills
        # the backlog over weeks, so a global coverage floor would keep main red for
        # months and teach everyone to ignore it. New entries are gated instead,
        # in the step below.
        run: |
          node -e "
          const d = JSON.parse(require('fs').readFileSync('data/entries.json','utf8'));
          const miss = (f) => d.entries.filter(e => !e[f]).length;
          const pct = (n) => ((1 - n / d.entries.length) * 100).toFixed(1);
          console.log('zh coverage: ' + pct(miss('descriptionZh')) + '% (' + miss('descriptionZh') + ' missing)');
          console.log('fr coverage: ' + pct(miss('descriptionFr')) + '% (' + miss('descriptionFr') + ' missing)');
          if (miss('descriptionZh') || miss('descriptionFr')) {
            console.log('::warning title=Translation backlog::' + miss('descriptionZh') + ' zh and ' + miss('descriptionFr') + ' fr descriptions are still pending. The weekly Translate workflow drains this.');
          }
          "

      - name: Entries added in this PR must ship all three languages
        if: github.event_name == 'pull_request'
        run: |
          set -e
          BASE=$(git fetch origin main --depth 1 >/dev/null 2>&1; git rev-parse origin/main)
          node -e "
          const { execFileSync } = require('node:child_process');
          const fs = require('fs');
          let diff = '';
          try {
            diff = execFileSync('git', ['diff', process.env.BASE + '...HEAD', '--', 'data/entries.json'], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
          } catch (e) { diff = ''; }
          const added = [...diff.matchAll(/^\+\s*\"name\":\s*\"([^\"]+)\"/gm)].map((m) => m[1]);
          if (!added.length) { console.log('no entries added in this PR — nothing to check'); process.exit(0); }
          const d = JSON.parse(fs.readFileSync('data/entries.json','utf8'));
          const known = new Set(d.entries.map((e) => e.name));
          // A name in the diff that the data file does not contain means the row was
          // written under a mismatched id/name pair. Passing silently would let a
          // half-written entry through.
          const unknown = added.filter((n) => !known.has(n));
          for (const n of unknown) console.error('::error file=data/entries.json::' + n + ' appears in the diff but not in the parsed data — check the id/name pair');
          const bad = d.entries.filter(e => added.includes(e.name) && (!e.description || !e.descriptionZh || !e.descriptionFr));
          for (const b of bad) {
            const missing = [!b.description && 'description', !b.descriptionZh && 'descriptionZh', !b.descriptionFr && 'descriptionFr'].filter(Boolean);
            console.error('::error file=data/entries.json::' + b.name + ' is missing ' + missing.join(', '));
          }
          if (unknown.length || bad.length) process.exit(1);
          console.log('all ' + added.length + ' new entr(y|ies) have all three descriptions');
          "